<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <rect width="600" height="450" fill="#F3EFE6"/>
  <rect x="28" y="28" width="544" height="394" rx="18" fill="#FFFFFF" stroke="#E4DEC9" stroke-width="2"/>
  <rect x="110" y="366" width="380" height="16" rx="8" fill="#E6E0D2"/>
  <!-- Office Multifunction Laser Printer -->
  <g transform="translate(136, 74)">
    <!-- Document Feeder / Top Tray -->
    <rect x="54" y="0" width="220" height="44" rx="8" fill="#FAF8F3" stroke="#1E2024" stroke-width="4"/>
    <line x1="84" y1="16" x2="200" y2="16" stroke="#C7C1B4" stroke-width="4" stroke-linecap="round"/>
    <line x1="84" y1="28" x2="170" y2="28" stroke="#C7C1B4" stroke-width="4" stroke-linecap="round"/>
    <!-- Main Printer Body -->
    <rect x="0" y="38" width="328" height="184" rx="16" fill="#FAF8F3" stroke="#1E2024" stroke-width="4"/>
    <rect x="32" y="68" width="264" height="84" rx="10" fill="#FFFFFF" stroke="#1E2024" stroke-width="3"/>
    <!-- Control Display -->
    <rect x="224" y="82" width="52" height="32" rx="6" fill="#1E2024"/>
    <circle cx="240" cy="126" r="5" fill="#E9252A"/>
    <circle cx="258" cy="126" r="5" fill="#8C919A"/>
    <!-- Brand Accent -->
    <rect x="52" y="88" width="90" height="10" rx="5" fill="#E9252A"/>
    <rect x="52" y="108" width="130" height="8" rx="4" fill="#C7C1B4"/>
    <!-- Paper Cassette -->
    <rect x="24" y="222" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#1E2024" stroke-width="4"/>
    <rect x="124" y="242" width="80" height="18" rx="5" fill="#E6E0D2" stroke="#1E2024" stroke-width="3"/>
  </g>
</svg>
